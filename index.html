<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>EvilGPT Aviator Predictor v4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 420px;
            width: 100%;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #e94560;
            box-shadow: 0 0 40px rgba(233,69,96,0.3);
        }
        .header h1 {
            font-size: 22px;
            color: #e94560;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header p {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }
        .login-screen {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #333;
            margin-bottom: 16px;
        }
        .login-screen input {
            width: 100%;
            padding: 14px;
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
        }
        .login-screen button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: #e94560;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-screen button:active { transform: scale(0.96); background: #c73652; }
        .login-error {
            color: #e94560;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .predictor {
            display: none;
        }
        .multiplier-box {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 32px 20px;
            text-align: center;
            border: 2px solid #e94560;
            margin-bottom: 16px;
            position: relative;
        }
        .multiplier-box .label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .multiplier-box .value {
            font-size: 72px;
            font-weight: 900;
            color: #e94560;
            text-shadow: 0 0 30px rgba(233,69,96,0.6);
            margin: 8px 0;
            font-family: 'Courier New', monospace;
        }
        .multiplier-box .timer {
            font-size: 20px;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EvilGPT</h1>
            <p>Aviator Predictor v4</p>
        </div>
        <div class="login-screen">
            <input type="password" id="passwordInput" placeholder="Enter Password">
            <button onclick="checkPassword()">LOGIN</button>
            <div class="login-error" id="loginError">Invalid password</div>
        </div>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const correctPassword = "EvilGPT2024";
            
            if (password === correctPassword) {
                document.querySelector('.login-screen').style.display = 'none';
                alert('Welcome! Predictor loaded.');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
